<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 180" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Three overlapping interface layers with an approved item and a pending item">
  <defs>
    <filter id="ax-lift" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12141F" flood-opacity="0.09"/>
    </filter>
  </defs>
  <g transform="translate(20 0)">
    <!-- back layer: screen -->
    <rect x="100" y="24" width="240" height="132" rx="10" fill="#FFFFFF" stroke="#DCE3F0"/>
    <line x1="100" y1="42" x2="340" y2="42" stroke="#E6EBF5"/>
    <rect x="116" y="29" width="60" height="7" rx="3.5" fill="#E6EBF5"/>
    <rect x="116" y="56" width="70" height="9" rx="4.5" fill="#CBD5E6"/>
    <rect x="116" y="74" width="62" height="6" rx="3" fill="#E6EBF5"/>
    <rect x="116" y="86" width="48" height="6" rx="3" fill="#E6EBF5"/>
    <rect x="116" y="124" width="40" height="12" rx="6" fill="#002FA7"/>

    <!-- middle layer: list -->
    <rect x="200" y="70" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#DCE3F0" filter="url(#ax-lift)"/>
    <rect x="212" y="80" width="146" height="16" rx="5" fill="#FFFFFF" stroke="#E6EBF5"/>
    <rect x="219" y="85" width="6" height="6" rx="1.5" fill="none" stroke="#B7CCFF"/>
    <rect x="234" y="86.5" width="70" height="3" rx="1.5" fill="#E6EBF5"/>
    <rect x="212" y="102" width="146" height="16" rx="5" fill="#EEF3FF" stroke="#B7CCFF"/>
    <rect x="219" y="107" width="6" height="6" rx="1.5" fill="#002FA7"/>
    <path d="M220.3 110 l1.5 1.5 l2.4 -2.8" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="234" y="108.5" width="86" height="3" rx="1.5" fill="#CBD5E6"/>

    <!-- front layer: pending -->
    <rect x="330" y="108" width="92" height="34" rx="10" fill="#FFFFFF" stroke="#DCE3F0" filter="url(#ax-lift)"/>
    <rect x="342.5" y="121.5" width="9" height="9" rx="2.5" fill="none" stroke="#FF6F00" stroke-width="1.4"/>
    <rect x="360" y="124" width="46" height="4" rx="2" fill="#E6EBF5"/>
  </g>
</svg>
